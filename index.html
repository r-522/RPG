const input = { up:false, down:false, left:false, right:false, ok:false, cancel:false };
const justPressed = {};
const keyMap = {
  'ArrowUp':'up','ArrowDown':'down','ArrowLeft':'left','ArrowRight':'right',
  'KeyW':'up','KeyS':'down','KeyA':'left','KeyD':'right',
  'Enter':'ok','Space':'ok','KeyZ':'ok',
  'Escape':'cancel','KeyX':'cancel','Backspace':'cancel'
};
window.addEventListener('keydown', (e) => {
  const k = keyMap[e.code];
  if (k) { if (!input[k]) justPressed[k] = true; input[k] = true; e.preventDefault(); }
});
window.addEventListener('keyup', (e) => {
  const k = keyMap[e.code];
  if (k) { input[k] = false; e.preventDefault(); }
});
cvs.addEventListener('click', () => cvs.focus());

function consume(name){ if (justPressed[name]){ justPressed[name]=false; return true;} return false; }
function clearJust(){ for (const k in justPressed) justPressed[k]=false; }

function pal(){ return gameState.route ? PALETTE[gameState.route] : PALETTE.hero; }

function drawWindow(x, y, w, h, opts){
  opts = opts || {};
  const p = pal();
  const fill = opts.fill || p.panel;
  const border = opts.border || p.border;
  const border2 = opts.border2 || p.border2;
  const hi = opts.highlight || false;
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = hi ? p.accent : border; ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.strokeStyle = border2; ctx.lineWidth = 1;
  ctx.strokeRect(x + 4, y + 4, w - 8, h - 8);
}

function drawText(text, x, y, opts){
  opts = opts || {};
  const size = opts.size || 14;
  const color = opts.color || pal().text;
  const align = opts.align || 'left';
  ctx.font = size + 'px "ＭＳ ゴシック","Osaka-Mono",monospace';
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  if (opts.shadow !== false){
    ctx.fillStyle = '#000';
    ctx.fillText(text, x + 1, y + 1);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawBar(x, y, w, h, ratio, color){
  const p = pal();
  ctx.fillStyle = '#000'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x + 1, y + 1, Math.floor((w - 2) * clamp(ratio, 0, 1)), h - 2);
  ctx.strokeStyle = p.border; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

function fillBg(){ ctx.fillStyle = pal().base; ctx.fillRect(0, 0, W, H); }

function drawSprite(spriteKey, cx, cy, dot, color){
  const grid = SPR[spriteKey];
  if (!grid) return;
  const w = grid[0].length * dot;
  const h = grid.length * dot;
  const x0 = Math.floor(cx - w / 2);
  const y0 = Math.floor(cy - h / 2);
  ctx.fillStyle = color;
  for (let r = 0; r < grid.length; r++){
    for (let c = 0; c < grid[r].length; c++){
      if (grid[r][c] === '1') ctx.fillRect(x0 + c * dot, y0 + r * dot, dot, dot);
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x0 + 4, y0 + h + 2, w - 8, 3);
}

function updateRouteSelect(){
  if (gameState.fade > 0) return;
  if (consume('left'))  gameState.routeDetailCursor = (gameState.routeDetailCursor + 1) % 2;
  if (consume('right')) gameState.routeDetailCursor = (gameState.routeDetailCursor + 1) % 2;
  if (consume('cancel')) startFade(() => { gameState.scene = 'title'; });
  if (consume('ok')){
    const r = gameState.routeDetailCursor === 0 ? 'hero' : 'demon';
    startFade(() => {
      gameState.route = r;
      gameState.scene = 'prologue';
      gameState.prologueText = PROLOGUE[r];
      gameState.prologueLine = 0;
      gameState.prologueChar = 0;
      gameState.prologueDoneTimer = 0;
    });
  }
}
function drawRouteSelect(){
  ctx.fillStyle = '#0a0a14'; ctx.fillRect(0, 0, W, H);
  drawText('道 を 選 べ', W/2, 18, { size:20, align:'center', color:'#c8b568' });
  drawText('両ルートとも 完走可能。それぞれ 戦い方が 違う。', W/2, 50, { size:12, align:'center', color:'#8a8270' });

  for (let i = 0; i < 2; i++){
    const key = i === 0 ? 'hero' : 'demon';
    const p = PALETTE[key];
    const tpl = PLAYER_TEMPLATE[key];
    const x = 20 + i * 305, y = 78, w = 295, h = 360;
    const selected = (gameState.routeDetailCursor === i);

    ctx.fillStyle = p.base; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = selected ? p.accent : p.border; ctx.lineWidth = 2;
    ctx.strokeRect(x+1, y+1, w-2, h-2);
    ctx.strokeStyle = p.border2; ctx.lineWidth = 1;
    ctx.strokeRect(x+4, y+4, w-8, h-8);

    // タイトル帯
    ctx.fillStyle = p.panel;
    ctx.fillRect(x+8, y+8, w-16, 32);
    drawText((i===0?'勇者の道':'魔王軍の道'), x + w/2, y + 14, { size:16, align:'center', color:p.accent });

    // スプライト
    drawSprite(tpl.sprite, x + 60, y + 90, 5, p.accent);

    // ステータス
    const sx = x + 110, sy = y + 60;
    drawText(tpl.title, sx, sy, { size:13, color:p.text });
    drawText('HP ' + tpl.hp,  sx,      sy+22, { size:12, color:p.text });
    drawText('MP ' + tpl.mp,  sx,      sy+38, { size:12, color:p.text });
    drawText('攻撃 ' + tpl.atk, sx+88, sy+22, { size:12, color:p.text });
    drawText('守備 ' + tpl.def, sx+88, sy+38, { size:12, color:p.text });
    drawText('回避 ' + tpl.eva + '%', sx, sy+54, { size:12, color:p.textDim });

    // 概要
    const summary = (i===0)

    const sumLines = summary.split('\n');
    for (let li = 0; li < sumLines.length; li++){

// ============================================================
// 8. プロローグ
// ============================================================
function updatePrologue(){
  if (gameState.fade > 0) return;
  const fast = input.ok || input.cancel;
  const speed = fast ? 5 : 1;
  for (let s = 0; s < speed; s++){
    if (gameState.prologueLine >= gameState.prologueText.length){
      gameState.prologueDoneTimer++; break;
    }
    const line = gameState.prologueText[gameState.prologueLine];
    if (gameState.prologueChar < line.length){
      gameState.prologueChar++;
    } else {
      gameState.prologueDoneTimer++;
      if (gameState.prologueDoneTimer > 14){
        gameState.prologueLine++;
        gameState.prologueChar = 0;
        gameState.prologueDoneTimer = 0;
      }
    }
  }
  if (gameState.prologueLine >= gameState.prologueText.length && gameState.prologueDoneTimer > 30){
    if (consume('ok')){
      startFade(() => {
        gameState.scene = 'name_input';
        gameState.nameInput = PLAYER_TEMPLATE[gameState.route].defaultName;
        gameState.nameCursor = 0;
      });
    }
  } else {
    consume('ok'); consume('cancel');
  }
}
function drawPrologue(){
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = pal().accent; ctx.lineWidth = 2;
  ctx.strokeRect(40, 40, W-80, H-80);
  ctx.strokeStyle = pal().border2; ctx.lineWidth = 1;
  ctx.strokeRect(46, 46, W-92, H-92);

  drawText('プロローグ', W/2, 70, { size:18, align:'center', color:pal().accent });

  const startY = 130;
  for (let i = 0; i <= gameState.prologueLine && i < gameState.prologueText.length; i++){
    let t = gameState.prologueText[i];
    if (i === gameState.prologueLine) t = t.slice(0, gameState.prologueChar);
    drawText(t, W/2, startY + i*26, { size:14, align:'center', color:pal().text });
  }
  if (gameState.prologueLine >= gameState.prologueText.length){
    if (Math.floor(performance.now()/500)%2===0)
      drawText('▼ Z で 名前を 決める', W/2, H-70, { size:13, align:'center', color:pal().accent });
  } else {
    drawText('Z で 早送り', W-60, H-66, { size:11, align:'right', color:'#3a3a4a' });
  }
}

// ============================================================
// 9. 名前入力
// ============================================================
const NAME_CHARS = [
  'アイウエオカキクケコ',
  'サシスセソタチツテト',
  'ナニヌネノハヒフヘホ',
  'マミムメモヤユヨラリ',
  'ルレロワヲンー　ｧｨｩ',
];
// グリッド 5x10、追加で「決定」「もどす」を 6行目に
const NAME_GRID_ROWS = 5;
const NAME_GRID_COLS = 10;
const NAME_EXTRA = ['決定','もどす'];
const NAME_MAX = 6;

function updateNameInput(){
  if (gameState.fade > 0) return;
  const row = Math.floor(gameState.nameCursor / NAME_GRID_COLS);
  const col = gameState.nameCursor % NAME_GRID_COLS;
  const totalRows = NAME_GRID_ROWS + 1;

  if (consume('up'))    gameState.nameCursor = ((row - 1 + totalRows) % totalRows) * NAME_GRID_COLS + Math.min(col, NAME_GRID_COLS-1);
  if (consume('down'))  gameState.nameCursor = ((row + 1) % totalRows) * NAME_GRID_COLS + Math.min(col, NAME_GRID_COLS-1);
  if (consume('left'))  gameState.nameCursor = row * NAME_GRID_COLS + ((col - 1 + NAME_GRID_COLS) % NAME_GRID_COLS);
  if (consume('right')) gameState.nameCursor = row * NAME_GRID_COLS + ((col + 1) % NAME_GRID_COLS);

  if (consume('cancel')){
    if (gameState.nameInput.length > 0)
      gameState.nameInput = gameState.nameInput.slice(0, -1);
  }
  if (consume('ok')){
    if (row < NAME_GRID_ROWS){
      const ch = NAME_CHARS[row][col];
      if (ch && ch !== '　' && gameState.nameInput.length < NAME_MAX){
        gameState.nameInput += ch;
      } else if (ch === '　' && gameState.nameInput.length < NAME_MAX){
        gameState.nameInput += '　';
      }
    } else {
      // extra row
      if (col < 4){
        // 決定
        if (gameState.nameInput.length === 0) gameState.nameInput = PLAYER_TEMPLATE[gameState.route].defaultName;
        startFade(() => {
          gameState.player = JSON.parse(JSON.stringify(PLAYER_TEMPLATE[gameState.route]));
          gameState.player.name = gameState.nameInput.trim() || PLAYER_TEMPLATE[gameState.route].defaultName;
          gameState.zoneIndex = 0;
          gameState.battlesInZone = 0;
          gameState.inventory = { yakusou:2, mahouNoMizu:1, motheRoot:0 };
          gameState.scene = 'map';
          gameState.cursor = 0;
          if (!gameState.mapTutorialDone){
            gameState.showTutorial = true;
            gameState.tutorialPage = 0;
          }
        });
      } else if (col >= 4 && col < 8){
        if (gameState.nameInput.length > 0) gameState.nameInput = gameState.nameInput.slice(0, -1);
      }
    }
  }
}
function drawNameInput(){
  const p = pal();
  fillBg();
  drawText('名前を 入力せよ', W/2, 24, { size:18, align:'center', color:p.accent });
  drawText(gameState.player ? '' : '(' + PLAYER_TEMPLATE[gameState.route].title + ')', W/2, 50, { size:12, align:'center', color:p.textDim });

  // 入力ウィンドウ
  const ix = 180, iy = 60, iw = 280, ih = 40;
  drawWindow(ix, iy, iw, ih);
  let display = gameState.nameInput;
  while (display.length < NAME_MAX) display += '＿';
  drawText(display, ix + iw/2, iy + 12, { size:18, align:'center', color:p.text });

  // グリッド
  const gx = 80, gy = 130, cellW = 48, cellH = 36;
  for (let r = 0; r < NAME_GRID_ROWS; r++){
    for (let c = 0; c < NAME_GRID_COLS; c++){
      const ch = NAME_CHARS[r][c];
      const idx = r * NAME_GRID_COLS + c;
      const selected = (idx === gameState.nameCursor);
      const cx = gx + c * cellW, cy = gy + r * cellH;
      if (selected){
        ctx.fillStyle = p.accent;
        ctx.fillRect(cx, cy, cellW, cellH);
        drawText(ch === '　' ? '空' : ch, cx + cellW/2, cy + 8, { size:18, align:'center', color:p.base });
      } else {
        ctx.strokeStyle = p.border2; ctx.lineWidth = 1;
        ctx.strokeRect(cx + 2, cy + 2, cellW - 4, cellH - 4);
        drawText(ch === '　' ? '空' : ch, cx + cellW/2, cy + 8, { size:18, align:'center', color:p.text });
      }
    }
  }

  // 追加行
  const extraY = gy + NAME_GRID_ROWS * cellH + 8;
  for (let i = 0; i < 2; i++){
    const cStart = i === 0 ? 0 : 4;
    const cEnd = i === 0 ? 4 : 8;
    const xStart = gx + cStart * cellW;
    const w = (cEnd - cStart) * cellW;
    const selected = (Math.floor(gameState.nameCursor / NAME_GRID_COLS) === NAME_GRID_ROWS) &&
                     (gameState.nameCursor % NAME_GRID_COLS) >= cStart &&
                     (gameState.nameCursor % NAME_GRID_COLS) < cEnd;
    if (selected){
      ctx.fillStyle = p.accent;
      ctx.fillRect(xStart, extraY, w - 6, cellH);
      drawText(NAME_EXTRA[i], xStart + w/2 - 3, extraY + 8, { size:16, align:'center', color:p.base });
    } else {
      ctx.strokeStyle = p.border2; ctx.lineWidth = 1;
      ctx.strokeRect(xStart + 2, extraY + 2, w - 10, cellH - 4);
      drawText(NAME_EXTRA[i], xStart + w/2 - 3, extraY + 8, { size:16, align:'center', color:p.text });
    }
  }

  drawText('↑↓←→ 選択   Z 確定文字   X 1文字消去', W/2, H - 28, { size:11, align:'center', color:p.textDim });
}

// 10. マップ
// ============================================================
const MAP_CMDS = ['戦う', '進む', 'ステータス', '道具', 'ヘルプ'];

function updateMap(){
  if (gameState.fade > 0) return;
  if (gameState.showTutorial){ updateTutorial(); return; }
  if (gameState.subScene === 'inventory'){ updateInventory(); return; }
  if (gameState.subScene === 'status'){ updateStatusView(); return; }

  if (consume('up'))   gameState.cursor = (gameState.cursor + MAP_CMDS.length - 1) % MAP_CMDS.length;
  if (consume('down')) gameState.cursor = (gameState.cursor + 1) % MAP_CMDS.length;
  if (consume('ok')){
    const zone = ZONES[gameState.route][gameState.zoneIndex];
    if (gameState.cursor === 0){
      const ek = zone.enemies[randInt(0, zone.enemies.length - 1)];
      startFade(() => startBattle(ek, false));
    } else if (gameState.cursor === 1){
      if (gameState.battlesInZone >= zone.need){
        if (gameState.zoneIndex >= ZONES[gameState.route].length - 1){
          startFade(() => { startBattle(FINAL_BOSS[gameState.route], true); });
        } else {
          startFade(() => { gameState.zoneIndex++; gameState.battlesInZone = 0; });
        }
      } else {
        gameState.mapMsg = 'まだ ' + (zone.need - gameState.battlesInZone) + ' 体 倒さねば 先へ 進めない。';
        gameState.mapMsgTimer = 120;
      }
    } else if (gameState.cursor === 2){
      gameState.subScene = 'status';
    } else if (gameState.cursor === 3){
      gameState.subScene = 'inventory';
      gameState.subCursor = 0;
    } else if (gameState.cursor === 4){
      gameState.showTutorial = true;
      gameState.tutorialPage = 0;
    }
  }
}

function drawMap(){
  const p = pal();
  fillBg();
  const zone = ZONES[gameState.route][gameState.zoneIndex];

  // 上部: 戦況バー
  drawWarBar(0, 0, W, 60);

  // 中央: ゾーン情景
  const mx = 16, my = 70, mw = W - 32, mh = 200;
  drawWindow(mx, my, mw, mh);
  drawLandscape(mx + 8, my + 8, mw - 16, mh - 48);
  drawText('第' + (gameState.zoneIndex + 1) + ' エリア : ' + zone.name, mx + 14, my + mh - 36, { size:14, color:p.accent });
  drawText(zone.msg, mx + 14, my + mh - 18, { size:12, color:p.text });
  drawText('討伐 ' + Math.min(gameState.battlesInZone, zone.need) + ' / ' + zone.need, mx + mw - 14, my + mh - 36, { size:13, color:p.text, align:'right' });

  // 下部: コマンド
  const cy = 282;
  drawWindow(16, cy, 180, 178);
  drawText('コマンド', 26, cy + 8, { size:12, color:p.accent });
  for (let i = 0; i < MAP_CMDS.length; i++){
    const sel = (i === gameState.cursor);
    const yy = cy + 30 + i * 26;
    if (sel){ ctx.fillStyle = p.accent; ctx.fillRect(26, yy + 8, 8, 4); }
    drawText(MAP_CMDS[i], 42, yy, { size:14, color: sel ? p.accent : p.text });
  }

  // ステータス
  drawStatusPanel(208, cy, W - 224, 178);

  // メッセージ
  if (gameState.mapMsgTimer > 0){
    ctx.fillStyle = '#000'; ctx.fillRect(20, H - 40, W - 40, 28);
    ctx.strokeStyle = p.hp; ctx.lineWidth = 1; ctx.strokeRect(20, H - 40, W - 40, 28);
    drawText(gameState.mapMsg, W/2, H - 32, { size:13, align:'center', color:p.text });
    gameState.mapMsgTimer--;
  }

  // サブシーン
  if (gameState.subScene === 'inventory') drawInventory();
  else if (gameState.subScene === 'status') drawStatusView();
  if (gameState.showTutorial) drawTutorial();
}

function drawWarBar(x, y, w, h){
  const p = pal();
  ctx.fillStyle = p.panel; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = p.border; ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);

  drawText('戦 況', x + 16, y + 8, { size:12, color:p.accent });
  // 自軍の進出度
  const zone = ZONES[gameState.route][gameState.zoneIndex];
  const ownDist = zone.dist + (gameState.battlesInZone / zone.need) * 0.05;
  const enemyDist = 0.95 - Math.min(0.6, ownDist * 0.7);

  const bx = x + 80, by = y + 28, bw = w - 100, bh = 14;
  // 背景
  ctx.fillStyle = '#000'; ctx.fillRect(bx, by, bw, bh);
  // 自軍領域
  const ownColor = gameState.route === 'hero' ? '#3a6aa8' : '#6a2a3a';
  ctx.fillStyle = ownColor;
  ctx.fillRect(bx + 1, by + 1, Math.floor((bw - 2) * ownDist), bh - 2);
  // 敵領域
  const enemyColor = gameState.route === 'hero' ? '#6a2a3a' : '#3a6aa8';
  ctx.fillStyle = enemyColor;
  const eW = Math.floor((bw - 2) * (1 - enemyDist));
  ctx.fillRect(bx + 1 + (bw - 2) - eW, by + 1, eW, bh - 2);
  // 自軍アイコン
  ctx.fillStyle = p.accent;
  const ownX = bx + Math.floor((bw - 2) * ownDist);
  ctx.fillRect(ownX - 2, by - 4, 4, bh + 8);
  // 敵アイコン
  ctx.fillStyle = gameState.route === 'hero' ? '#a85838' : '#c8b568';
  const enX = bx + Math.floor((bw - 2) * enemyDist);
  ctx.fillRect(enX - 2, by - 4, 4, bh + 8);

  // ラベル
  drawText(gameState.route === 'hero' ? '勇者軍' : '魔王軍', bx, y + 46, { size:11, color:p.text });
  drawText(gameState.route === 'hero' ? '魔王軍' : '勇者軍', bx + bw, y + 46, { size:11, color:p.text, align:'right' });
  const pct = Math.floor(ownDist * 100);
  drawText('進軍度 ' + pct + '%', bx + bw/2, y + 46, { size:11, align:'center', color:p.accent });
}

function drawLandscape(x, y, w, h){
  const p = pal();
  ctx.fillStyle = gameState.route === 'hero' ? '#1a2848' : '#2a1428';
  ctx.fillRect(x, y, w, Math.floor(h * 0.55));
  ctx.fillStyle = gameState.route === 'hero' ? '#2a3a28' : '#2a1a1a';
  ctx.fillRect(x, y + Math.floor(h * 0.55), w, h - Math.floor(h * 0.55));
  ctx.fillStyle = '#000';
  ctx.fillRect(x, y + Math.floor(h * 0.55) - 1, w, 1);

  const zi = gameState.zoneIndex;
  ctx.fillStyle = gameState.route === 'hero' ? '#3a4a58' : '#3a2838';
  const horizon = y + Math.floor(h * 0.55);
  for (let i = 0; i < 5 + zi; i++){
    const mx = x + ((i * 97 + zi * 31) % w);
    const mh = 24 + ((i * 53 + zi * 17) % 32);
    for (let dy = 0; dy < mh; dy++){
      const sw = mh - dy;
      ctx.fillRect(mx - sw, horizon - dy, sw * 2, 1);
    }
  }

  ctx.fillStyle = gameState.route === 'hero' ? '#5a4a38' : '#3a2828';
  const roadY = horizon + Math.floor((h - (horizon - y)) * 0.4);
  for (let i = 0; i < 20; i++){
    const rw = 6 + i * 3;
    ctx.fillRect(x + w/2 - rw/2, roadY + i * 2, rw, 2);
  }

  if (zi >= ZONES[gameState.route].length - 1){
    const cxp = x + w/2, cy2 = horizon - 40;
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(cxp - 28, cy2, 56, 44);
    ctx.fillRect(cxp - 34, cy2 + 4, 6, 40);
    ctx.fillRect(cxp + 28, cy2 + 4, 6, 40);
    ctx.fillStyle = p.accent;
    ctx.fillRect(cxp - 1, cy2 - 12, 2, 12);
    ctx.fillRect(cxp - 1, cy2 - 12, 7, 4);
  }
  drawSprite(gameState.player.sprite, x + w/2, horizon - 18, 3, p.accent);
}

// 12. 道具
// ============================================================
function getInventoryList(){
  const list = [];
  for (const k in gameState.inventory){
    if (gameState.inventory[k] > 0) list.push(k);
  }
  return list;
}

function updateInventory(){
  const list = getInventoryList();
  if (consume('cancel')){ gameState.subScene = null; return; }
  if (list.length === 0){
    if (consume('ok')){ gameState.subScene = null; return; }
    return;
  }
  if (consume('up'))   gameState.subCursor = (gameState.subCursor + list.length - 1) % list.length;
  if (consume('down')) gameState.subCursor = (gameState.subCursor + 1) % list.length;
  if (consume('ok')){
    const k = list[gameState.subCursor];
    const it = ITEMS[k];
    const pl = gameState.player;
    if (it.type === 'heal'){
      if (pl.hp >= pl.maxHp){ gameState.mapMsg = 'HPは満タンだ。'; gameState.mapMsgTimer = 80; return; }
      pl.hp = Math.min(pl.maxHp, pl.hp + it.amount);
      gameState.inventory[k]--;
      gameState.mapMsg = it.name + 'を 使った。HP+' + it.amount;
      gameState.mapMsgTimer = 80;
    } else if (it.type === 'mp'){
      if (pl.mp >= pl.maxMp){ gameState.mapMsg = 'MPは満タンだ。'; gameState.mapMsgTimer = 80; return; }
      pl.mp = Math.min(pl.maxMp, pl.mp + it.amount);
      gameState.inventory[k]--;
      gameState.mapMsg = it.name + 'を 使った。MP+' + it.amount;
      gameState.mapMsgTimer = 80;
    } else if (it.type === 'fullHp'){
      pl.hp = pl.maxHp;
      gameState.inventory[k]--;
      gameState.mapMsg = it.name + 'で HP全回復！';
      gameState.mapMsgTimer = 80;
    }
    if (gameState.subCursor >= getInventoryList().length) gameState.subCursor = Math.max(0, getInventoryList().length - 1);
  }
}
function drawInventory(){
  const p = pal();
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
  const x=100, y=80, w=W-200, h=H-160;

  drawText('— 道具 —', x + w/2, y + 12, { size:16, align:'center', color:p.accent });

  if (list.length === 0){
    drawText('何も 持っていない。', x + w/2, y + h/2 - 8, { size:14, align:'center', color:p.textDim });
  } else {
    for (let i = 0; i < list.length; i++){
      const k = list[i];
      const it = ITEMS[k];
      const sel = (i === gameState.subCursor);
      const yy = y + 50 + i * 36;
      if (sel){ ctx.fillStyle = p.accent; ctx.fillRect(x + 18, yy + 10, 8, 4); }
      drawText(it.name, x + 34, yy, { size:14, color: sel ? p.accent : p.text });

    }
  }
  drawText('Z 使う   X 戻る', x + w/2, y + h - 24, { size:11, align:'center', color:p.textDim });
}

// 14. 戦闘
// ============================================================
const BATTLE_CMDS = ['攻撃', '特技', '防御', '道具', '逃げる'];

function startBattle(enemyKey, isFinal){
  const tpl = ENEMIES[enemyKey];
  gameState.enemy = Object.assign({}, tpl);
  gameState.enemy.maxHp = tpl.hp;
  gameState.enemy.key = enemyKey;
  gameState.scene = isFinal ? 'final_battle' : 'battle';
  gameState.battlePhase = 'menu';
  gameState.cursor = 0;
  gameState.subCursor = 0;
  gameState.messages = [];
  gameState.damages = [];
  gameState.shake = 0;
  gameState.flash = 0;
  gameState.defending = false;
  gameState.defendBonus = 0;
  pushMsg(tpl.name + ' が あらわれた！');
  if (!gameState.battleTutorialDone && !isFinal){
    gameState.showTutorial = true;
    gameState.tutorialPage = 1; // 戦闘ページから
    gameState.battleTutorialDone = true;
  }
}

function pushMsg(text){
  gameState.messages.push(text);
  while (gameState.messages.length > 4) gameState.messages.shift();
}

function spawnDamage(text, side, color){
  gameState.damages.push({ text, side, y: 0, vy: -1.5, life: 50, color });
}

function calcAttackHit(attacker, defender){
  return Math.random() * 100 >= defender.eva;
}

function calcDamage(attacker, defender, mul, isCrit, pierce){
  const def = pierce ? Math.floor(defender.def / 2) : defender.def;
  let base = attacker.atk * (mul || 1) - def;
  base += randInt(-2, 2);
  if (isCrit) base = Math.floor(base * 1.6);
  return Math.max(1, Math.floor(base));
}

function playerNormalAttack(){
  const pl = gameState.player, en = gameState.enemy;
  pushMsg(pl.name + 'の こうげき！');
  if (!calcAttackHit(pl, en)){
    pushMsg('しかし ' + en.name + 'は かわした！');
    gameState.battlePhase = 'message'; gameState.msgTimer = 40; gameState.nextPhase = 'enemyTurn';
    return;
  }
  const isCrit = Math.random() < 0.10;
  const dmg = calcDamage(pl, en, 1, isCrit, false);
  en.hp = Math.max(0, en.hp - dmg);
  spawnDamage(String(dmg), 'enemy', isCrit ? '#ffcc66' : '#ffffff');
  gameState.shake = 12;
  if (isCrit) pushMsg('会心の 一撃！');
  pushMsg(en.name + 'に ' + dmg + ' の ダメージ！');
  gameState.battlePhase = 'message'; gameState.msgTimer = 50; gameState.nextPhase = 'enemyTurn';
}

function playerUseSkill(skillKey){
  const pl = gameState.player, en = gameState.enemy;
  const sk = SKILLS[skillKey];
  if (pl.mp < sk.mp){
    pushMsg('MPが 足りない！');
    gameState.battlePhase = 'message'; gameState.msgTimer = 40; gameState.nextPhase = 'menu';
    return;
  }
  pl.mp -= sk.mp;
  pushMsg(pl.name + 'は ' + sk.name + ' を 放った！');
  if (sk.type === 'heal'){
    const before = pl.hp;
    pl.hp = Math.min(pl.maxHp, pl.hp + sk.heal);
    const healed = pl.hp - before;
    spawnDamage('+' + healed, 'self', '#66cc88');
    pushMsg('HPが ' + healed + ' 回復した！');
    gameState.battlePhase = 'message'; gameState.msgTimer = 50; gameState.nextPhase = 'enemyTurn';
    return;
  }
  // 攻撃系 (必中含む)
  if (!sk.sure && !calcAttackHit(pl, en)){
    pushMsg('しかし ' + en.name + 'に かわされた！');
    gameState.battlePhase = 'message'; gameState.msgTimer = 40; gameState.nextPhase = 'enemyTurn';
    return;
  }
  const isCrit = Math.random() < 0.08;
  const dmg = calcDamage(pl, en, sk.mul, isCrit, sk.type === 'pierce');
  en.hp = Math.max(0, en.hp - dmg);
  spawnDamage(String(dmg), 'enemy', isCrit ? '#ffcc66' : '#aaccff');
  gameState.shake = 14;
  pushMsg(en.name + 'に ' + dmg + ' の ダメージ！');
  if (sk.type === 'drain'){
    const heal = Math.floor(dmg / 2);
    pl.hp = Math.min(pl.maxHp, pl.hp + heal);
    spawnDamage('+' + heal, 'self', '#66cc88');
    pushMsg('生命力を ' + heal + ' 吸い取った！');
  }
  gameState.battlePhase = 'message'; gameState.msgTimer = 55; gameState.nextPhase = 'enemyTurn';
}

function playerUseItem(itemKey){
  const pl = gameState.player;
  const it = ITEMS[itemKey];
  if (gameState.inventory[itemKey] <= 0){ return; }
  gameState.inventory[itemKey]--;
  if (it.type === 'heal'){
    const before = pl.hp;
    pl.hp = Math.min(pl.maxHp, pl.hp + it.amount);
    pushMsg(pl.name + 'は ' + it.name + 'を 使った。');
    pushMsg('HPが ' + (pl.hp - before) + ' 回復した！');
    spawnDamage('+' + (pl.hp - before), 'self', '#66cc88');
  } else if (it.type === 'mp'){
    const before = pl.mp;
    pl.mp = Math.min(pl.maxMp, pl.mp + it.amount);
    pushMsg(pl.name + 'は ' + it.name + 'を 使った。');
    pushMsg('MPが ' + (pl.mp - before) + ' 回復した！');
  } else if (it.type === 'fullHp'){
    pl.hp = pl.maxHp;
    pushMsg(it.name + ' HP全回復！');
  }
  gameState.battlePhase = 'message'; gameState.msgTimer = 50; gameState.nextPhase = 'enemyTurn';
}

function enemyTurn(){
  const pl = gameState.player, en = gameState.enemy;
  if (en.hp <= 0){ resolveWin(); return; }
  pushMsg(en.name + 'の こうげき！');
  // プレイヤー回避
  const evaBonus = gameState.defending ? 10 : 0;
  if (Math.random() * 100 < pl.eva + evaBonus){
    pushMsg(pl.name + 'は すばやく かわした！');
    gameState.defending = false;
    gameState.battlePhase = 'message'; gameState.msgTimer = 40; gameState.nextPhase = 'menu';
    return;
  }
  const isCrit = Math.random() < 0.08;
  const defMul = gameState.defending ? 2 : 1;
  let base = en.atk - pl.def * defMul;
  base += randInt(-2, 2);
  if (isCrit) base = Math.floor(base * 1.5);
  if (gameState.defending) base = Math.floor(base / 2);
  const dmg = Math.max(1, Math.floor(base));
  pl.hp = Math.max(0, pl.hp - dmg);
  if (isCrit) pushMsg('痛恨の 一撃！');
  pushMsg(pl.name + 'は ' + dmg + ' の ダメージを 受けた！');
  spawnDamage(String(dmg), 'self', isCrit ? '#ff6644' : '#ffaaaa');
  gameState.shake = 10;
  gameState.defending = false;
  gameState.battlePhase = 'message'; gameState.msgTimer = 50;
  gameState.nextPhase = pl.hp <= 0 ? 'lose' : 'menu';
}

function resolveWin(){
  const pl = gameState.player, en = gameState.enemy;
  pushMsg(en.name + 'を 倒した！');
  if (gameState.scene === 'final_battle'){
    gameState.battlePhase = 'finalWin'; gameState.msgTimer = 90; gameState.flash = 30; return;
  }
  pl.exp += en.exp;
  pushMsg(en.exp + ' の 経験値を 得た！');
  // ドロップ
  if (Math.random() < 0.32){
    const drops = ['yakusou','yakusou','yakusou','mahouNoMizu'];
    const k = drops[randInt(0, drops.length - 1)];
    gameState.inventory[k] = (gameState.inventory[k] || 0) + 1;
    pushMsg(ITEMS[k].name + 'を 手に入れた！');
  }
  let leveled = false;
  while (pl.exp >= requiredExp(pl.lv)){
    pl.exp -= requiredExp(pl.lv);
    pl.lv++;
    const g = LEVEL_GAIN[gameState.route];
    pl.maxHp += g.hp; pl.hp = pl.maxHp;
    pl.maxMp += g.mp; pl.mp = pl.maxMp;
    pl.atk += g.atk; pl.def += g.def; pl.eva += g.eva;
    leveled = true;
  }
  if (leveled) pushMsg('レベルが ' + pl.lv + ' に 上がった！');
  gameState.battlesInZone++;
  gameState.battlePhase = 'win'; gameState.msgTimer = 100;
}

function startBattleLose(){
  gameState.battlePhase = 'lose'; gameState.msgTimer = 100;
  pushMsg(gameState.player.name + 'は 倒れた…');
}

function updateBattle(){
  for (const d of gameState.damages){ d.y += d.vy; d.life--; }
  gameState.damages = gameState.damages.filter(d => d.life > 0);
  if (gameState.shake > 0) gameState.shake--;
  if (gameState.flash > 0) gameState.flash--;
  if (gameState.fade > 0) return;

  if (gameState.showTutorial){ updateTutorial(); return; }

  const phase = gameState.battlePhase;

  if (phase === 'menu'){
    if (consume('up'))   gameState.cursor = (gameState.cursor + BATTLE_CMDS.length - 1) % BATTLE_CMDS.length;
    if (consume('down')) gameState.cursor = (gameState.cursor + 1) % BATTLE_CMDS.length;
    if (consume('ok')){
      const c = gameState.cursor;
      if (c === 0) playerNormalAttack();
      else if (c === 1){ gameState.battlePhase = 'skillSelect'; gameState.subCursor = 0; }
      else if (c === 2){
        gameState.defending = true;
        pushMsg(gameState.player.name + 'は 身を かまえた！');
        gameState.battlePhase = 'message'; gameState.msgTimer = 30; gameState.nextPhase = 'enemyTurn';
      } else if (c === 3){ gameState.battlePhase = 'itemSelect'; gameState.subCursor = 0; }
      else if (c === 4){
        if (gameState.scene === 'final_battle'){
          pushMsg('逃げられない！');
          gameState.battlePhase = 'message'; gameState.msgTimer = 30; gameState.nextPhase = 'enemyTurn';
        } else if (Math.random() < 0.6){
          pushMsg('うまく 逃げ切れた！');
          gameState.battlePhase = 'flee'; gameState.msgTimer = 50;
        } else {
          pushMsg('しかし 回り込まれた！');
          gameState.battlePhase = 'message'; gameState.msgTimer = 30; gameState.nextPhase = 'enemyTurn';
        }
      }
    }
  } else if (phase === 'skillSelect'){
    const skills = gameState.player.skills;
    if (consume('up'))   gameState.subCursor = (gameState.subCursor + skills.length - 1) % skills.length;
    if (consume('down')) gameState.subCursor = (gameState.subCursor + 1) % skills.length;
    if (consume('cancel')){ gameState.battlePhase = 'menu'; }
    if (consume('ok')){ playerUseSkill(skills[gameState.subCursor]); }
  } else if (phase === 'itemSelect'){
    const list = getInventoryList();
    if (consume('cancel')){ gameState.battlePhase = 'menu'; return; }
    if (list.length === 0){
      if (consume('ok')){ gameState.battlePhase = 'menu'; return; }
      return;
    }
    if (consume('up'))   gameState.subCursor = (gameState.subCursor + list.length - 1) % list.length;
    if (consume('down')) gameState.subCursor = (gameState.subCursor + 1) % list.length;
    if (consume('ok')){ playerUseItem(list[gameState.subCursor]); }
  } else if (phase === 'message'){
    if (gameState.msgTimer > 0) gameState.msgTimer--;
    else {
      if (gameState.enemy.hp <= 0) resolveWin();
      else if (gameState.nextPhase === 'enemyTurn') enemyTurn();
      else if (gameState.nextPhase === 'lose') startBattleLose();
      else { gameState.battlePhase = 'menu'; clearJust(); }
    }
  } else if (phase === 'win'){
    if (gameState.msgTimer > 0) gameState.msgTimer--;
    if (gameState.msgTimer <= 0){
      startFade(() => { gameState.scene = 'map'; gameState.cursor = 0; gameState.subScene = null; });
      gameState.battlePhase = 'done';
    }
  } else if (phase === 'flee'){
    if (gameState.msgTimer > 0) gameState.msgTimer--;
    else { startFade(() => { gameState.scene = 'map'; gameState.cursor = 0; gameState.subScene = null; }); gameState.battlePhase = 'done'; }
  } else if (phase === 'lose'){
    if (gameState.msgTimer > 0) gameState.msgTimer--;
    else { startFade(() => { gameState.scene = 'ending'; gameState.endingType = 'lose'; prepareEnding(); }); gameState.battlePhase = 'done'; }
  } else if (phase === 'finalWin'){
    if (gameState.msgTimer > 0) gameState.msgTimer--;
    else { startFade(() => { gameState.scene = 'ending'; gameState.endingType = 'win'; prepareEnding(); }); gameState.battlePhase = 'done'; }
  }
}

function drawBattle(){
  const p = pal();
  if (gameState.flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + (gameState.flash / 30) + ')'; ctx.fillRect(0,0,W,H);
  }
  let sx = 0, sy = 0;
  if (gameState.shake > 0){ sx = randInt(-3,3); sy = randInt(-2,2); }
  ctx.save(); ctx.translate(sx, sy);
  fillBg();

  // 上半分: 敵
  ctx.fillStyle = gameState.route === 'hero' ? '#1a2848' : '#2a1428';
  ctx.fillRect(0, 0, W, 144);
  ctx.fillStyle = gameState.route === 'hero' ? '#2a3a28' : '#2a1a1a';
  ctx.fillRect(0, 144, W, 96);

  const en = gameState.enemy;
  let ex = W/2, ey = 130;
  const dotSize = gameState.scene === 'final_battle' ? 10 : 7;
  drawSprite(en.sprite, ex, ey, dotSize, en.color);

  // 敵情報
  const enX = 16, enY = 12;
  drawWindow(enX, enY, W - 32, 44);
  drawText(en.name, enX + 14, enY + 6, { size:14, color:p.accent });
  drawText('Lv ? 攻 ' + en.atk + ' 守 ' + en.def + ' 回避 ' + en.eva + '%', enX + 14, enY + 24, { size:11, color:p.textDim });
  drawBar(enX + 240, enY + 10, 280, 10, en.hp / en.maxHp, p.hp);
  drawText('HP', enX + 220, enY + 8, { size:11, color:p.text });
  drawText(en.hp + '/' + en.maxHp, enX + W - 32 - 14, enY + 22, { size:11, color:p.text, align:'right' });

  // 下半分
  ctx.fillStyle = p.base; ctx.fillRect(0, 240, W, H - 240);

  // コマンド
  const cmdX=8, cmdY=248, cmdW=168, cmdH=160;
  drawWindow(cmdX, cmdY, cmdW, cmdH);
  drawText('コマンド', cmdX + 12, cmdY + 8, { size:12, color:p.accent });
  const showCmd = (gameState.battlePhase === 'menu');
  for (let i = 0; i < BATTLE_CMDS.length; i++){
    const sel = showCmd && (i === gameState.cursor);
    const yy = cmdY + 32 + i * 22;
    if (sel){ ctx.fillStyle = p.accent; ctx.fillRect(cmdX + 14, yy + 7, 6, 4); }
    drawText(BATTLE_CMDS[i], cmdX + 28, yy, { size:14, color: sel ? p.accent : p.text });
  }

  // ステータス
  const stX = 184, stY = 248, stW = W - 184 - 8, stH = 160;
  drawWindow(stX, stY, stW, stH);
  const pl = gameState.player;
  drawText(pl.name + '  Lv ' + pl.lv, stX + 12, stY + 8, { size:13, color:p.accent });
  drawText('HP', stX + 12, stY + 30, { size:11, color:p.text });
  drawBar(stX + 40, stY + 32, stW - 110, 10, pl.hp / pl.maxHp, p.hp);
  drawText(pl.hp + '/' + pl.maxHp, stX + stW - 12, stY + 30, { size:11, color:p.text, align:'right' });
  drawText('MP', stX + 12, stY + 50, { size:11, color:p.text });
  drawBar(stX + 40, stY + 52, stW - 110, 10, pl.mp / pl.maxMp, p.mp);
  drawText(pl.mp + '/' + pl.maxMp, stX + stW - 12, stY + 50, { size:11, color:p.text, align:'right' });
  drawText('攻 ' + pl.atk + '  守 ' + pl.def + '  回避 ' + pl.eva + '%', stX + 12, stY + 72, { size:11, color:p.text });
  drawText(gameState.defending ? '【防御中】' : '', stX + 12, stY + 90, { size:11, color:p.accent });

  // サブメニュー (特技/道具)
  if (gameState.battlePhase === 'skillSelect'){
    drawSubMenu('特技', gameState.player.skills.map(k => {
      const s = SKILLS[k];
      return { label: s.name + ' (MP' + s.mp + ')', desc: s.desc, disabled: pl.mp < s.mp };
    }), gameState.subCursor);
  } else if (gameState.battlePhase === 'itemSelect'){
    const list = getInventoryList();
    drawSubMenu('道具', list.length === 0
      ? [{ label:'(何も 持っていない)', desc:'X で 戻る', disabled:true }]
      : list.map(k => ({ label: ITEMS[k].name + ' ×' + gameState.inventory[k], desc: ITEMS[k].desc, disabled:false }))
    , gameState.subCursor);
  }

  // メッセージログ
  const lgX = 8, lgY = 414, lgW = W - 16, lgH = H - 414 - 4;
  drawWindow(lgX, lgY, lgW, lgH);
  const visible = gameState.messages.slice(-3);
  for (let i = 0; i < visible.length; i++){
    drawText(visible[i], lgX + 14, lgY + 8 + i * 16, { size:12, color:p.text });
  }

  // ダメージ数値
  for (const d of gameState.damages){
    const isEnemy = (d.side === 'enemy');
    const targetX = isEnemy ? ex : (stX + stW/2);
    const targetY = (isEnemy ? ey - 30 : stY + 50) + d.y;
    const alpha = clamp(d.life / 30, 0, 1);
    ctx.globalAlpha = alpha;
    drawText(d.text, targetX, targetY, { size:20, align:'center', color:d.color });
    ctx.globalAlpha = 1;
  }

  ctx.restore();
  if (gameState.showTutorial) drawTutorial();
}

function drawSubMenu(title, items, cursor){
  const p = pal();
  const x = 90, y = 130, w = W - 180, h = 230;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
  drawWindow(x, y, w, h);
  drawText('— ' + title + ' —', x + w/2, y + 10, { size:14, align:'center', color:p.accent });
  for (let i = 0; i < items.length; i++){
    const it = items[i];
    const sel = (i === cursor);
    const yy = y + 44 + i * 36;
    if (sel){ ctx.fillStyle = p.accent; ctx.fillRect(x + 18, yy + 8, 8, 4); }
    const col = it.disabled ? p.textDim : (sel ? p.accent : p.text);
    drawText(it.label, x + 34, yy, { size:14, color: col });
    if (sel) drawText(it.desc, x + 34, yy + 18, { size:11, color:p.textDim });
  }
  drawText('Z 決定   X 戻る', x + w/2, y + h - 24, { size:11, align:'center', color:p.textDim });
}

// ============================================================
// 15. エンディング
// ============================================================
const ENDING_TEXT = {
  hero_win: [
    '魔王ザギルは 静かに 膝をついた。',
    '「人間…よ。この刃は、いつか…」',
    '声は 風に かき消え、城は 崩れ落ちた。',
    '',
    gameState => gameState.player.name + 'は 故郷へと 帰り着いた。',
    '畑に 麦が 揺れ、誰もが 名を 呼んでくれる。',
    'しかし 旅の 記憶だけは、',
    'いつまでも 胸の奥で 灯っていた。',
    '',
    '― 勇者ルート  完 ―',
  ],
  demon_win: [
    '勇者リオンは 剣を 取り落とした。',
    '「ならば…俺の意志は…誰が…」',
    '聖堂の光は 翳り、王都は 黒い旗に 覆われた。',
    '',
    gameState => gameState.player.name + 'は 玉座に 腰を下ろす。',
    '人類は 膝を折り、長い夜が 始まった。',
    '勝利の 味は 苦く、ただ 静かだった。',
    '',
    '― 魔王軍ルート  完 ―',
  ],
  hero_lose: [
    gameState => gameState.player.name + 'の 意識は 闇へと 沈んでいく。',
    '世界は 救われなかった。',
    '',
    '魔王の 哄笑が どこまでも 響き渡る。',
    '',
    '― BAD END ―',
    '',
    '(Z で タイトルへ)',
  ],
  demon_lose: [
    gameState => gameState.player.name + 'は 光の中で 砕け散った。',
    '魔王軍の 野望は 潰えた。',
    '',
    '勇者の 物語が、今 始まる。',
    '',
    '― BAD END ―',
    '',
    '(Z で タイトルへ)',
  ],
};

function prepareEnding(){
  const key = gameState.route + '_' + gameState.endingType;
  gameState.endingText = ENDING_TEXT[key].map(t => typeof t === 'function' ? t(gameState) : t);
  gameState.endingLine = 0; gameState.endingChar = 0; gameState.endingDoneTimer = 0;
}

function updateEnding(){
  if (gameState.fade > 0) return;
  const fast = input.ok || input.cancel;
  const speed = fast ? 4 : 1;
  for (let s = 0; s < speed; s++){
    if (gameState.endingLine >= gameState.endingText.length){ gameState.endingDoneTimer++; break; }
    const line = gameState.endingText[gameState.endingLine];
    if (gameState.endingChar < line.length){ gameState.endingChar++; }
    else { gameState.endingDoneTimer++; if (gameState.endingDoneTimer > 18){ gameState.endingLine++; gameState.endingChar = 0; gameState.endingDoneTimer = 0; } }
  }
  if (gameState.endingLine >= gameState.endingText.length && gameState.endingDoneTimer > 60){
    if (consume('ok')){
      startFade(() => {
        Object.assign(gameState, {
          scene:'title', route:null, player:null, zoneIndex:0, battlesInZone:0,
          enemy:null, cursor:0, subCursor:0, messages:[], damages:[], endingText:[],
          subScene:null, showTutorial:false, mapTutorialDone:false, battleTutorialDone:false,
          inventory:{ yakusou:2, mahouNoMizu:1, motheRoot:0 },
        });
      });
    }
  } else { consume('ok'); consume('cancel'); }
}

function drawEnding(){
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = pal().accent; ctx.lineWidth = 2;
  ctx.strokeRect(40, 40, W-80, H-80);
  ctx.strokeStyle = pal().border2; ctx.lineWidth = 1;
  ctx.strokeRect(46, 46, W-92, H-92);
  const title = gameState.endingType === 'win' ? 'ENDING' : 'GAME OVER';
  drawText(title, W/2, 70, { size:20, align:'center', color:pal().accent });
  const startY = 130;
  for (let i = 0; i < gameState.endingText.length; i++){
    let t = gameState.endingText[i];
    if (i > gameState.endingLine) break;
    if (i === gameState.endingLine) t = t.slice(0, gameState.endingChar);
    drawText(t, W/2, startY + i * 24, { size:14, align:'center', color:pal().text });
  }
  if (gameState.endingLine >= gameState.endingText.length){
    if (Math.floor(performance.now() / 500) % 2 === 0)
      drawText('▼ Z でタイトルへ', W/2, H - 70, { size:14, align:'center', color:pal().accent });
  }
}

// ============================================================
// 16. フェード
// ============================================================
function startFade(onMid){ gameState.fade = 0.01; gameState.fadeDir = 1; gameState.fadeNext = onMid; }
function updateFade(){
  if (gameState.fade <= 0) return;
  gameState.fade += gameState.fadeDir * 0.08;
  if (gameState.fade >= 1 && gameState.fadeDir > 0){
    gameState.fade = 1;
    if (gameState.fadeNext){ gameState.fadeNext(); gameState.fadeNext = null; }
    gameState.fadeDir = -1; clearJust();
  } else if (gameState.fade <= 0 && gameState.fadeDir < 0){
    gameState.fade = 0; gameState.fadeDir = 0;
  }
}
function drawFade(){
  if (gameState.fade <= 0) return;
  ctx.fillStyle = 'rgba(0,0,0,' + gameState.fade + ')';
  ctx.fillRect(0,0,W,H);
}

// ============================================================
// 17. メインループ
// ============================================================
function update(){
  updateFade();
  switch (gameState.scene){
    case 'title':        updateTitle(); break;
    case 'route_select': updateRouteSelect(); break;
    case 'prologue':     updatePrologue(); break;
    case 'name_input':   updateNameInput(); break;
    case 'map':          updateMap(); break;
    case 'battle':
    case 'final_battle': updateBattle(); break;
    case 'ending':       updateEnding(); break;
  }
  for (const k in justPressed) justPressed[k] = false;
}
function draw(){
  switch (gameState.scene){
    case 'title':        drawTitle(); break;
    case 'route_select': drawRouteSelect(); break;
    case 'prologue':     drawPrologue(); break;
    case 'name_input':   drawNameInput(); break;
    case 'map':          drawMap(); break;
    case 'battle':
    case 'final_battle': drawBattle(); break;
    case 'ending':       drawEnding(); break;
  }
  drawFade();
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }

cvs.focus();
loop();
</script>
